<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WebHelm</title>
  <style>
    :root { color-scheme: light dark; --ink:#182234; --muted:#5f6d81; --border:#e1e7f0; --accent:#345fd5; --accent-light:#edf2ff; --warning:#ae3849; }
    * { box-sizing: border-box; }
    body { width:320px; margin:0; padding:12px 14px; background:light-dark(#fff,#172131); color:light-dark(var(--ink),#edf2f9); font:12px/1.4 system-ui,sans-serif; }
    .panel-heading { display:flex; align-items:center; justify-content:flex-end; margin-bottom:3px; }
    .daemon-state { font-size:11px; color:light-dark(var(--muted),#acb8c9); white-space:nowrap; }
    .daemon-state::before { content:""; display:inline-block; vertical-align:middle; width:6px; height:6px; border-radius:50%; background:#8893a1; margin-right:5px; }
    .daemon-state.online::before { background:#23915c; }
    .daemon-state.offline::before { background:#ae3849; }
    p { margin:3px 0 9px; color:light-dark(var(--muted),#acb8c9); }
    button { width:100%; border:1px solid light-dark(var(--border),#40516a); background:light-dark(#fff,#22314a); color:inherit; border-radius:9px; padding:9px; cursor:pointer; font:inherit; font-weight:600; }
    button:disabled { opacity:.5; cursor:not-allowed; }
    button.danger { background:#ae3849; color:#fff; border-color:#ae3849; }
    button:focus-visible { outline:3px solid var(--accent); outline-offset:2px; }
    #confirmation { margin:8px 0; padding:11px; background:light-dark(#fff1f2,#43222a); border-radius:9px; }
    #confirmation p { color:inherit; }
    .buttons { display:flex; gap:8px; }
    .session-list { max-height:360px; overflow-y:auto; }
    .workspace-row { padding:9px 0; border-bottom:1px solid light-dark(var(--border),#334155); }
    .workspace-row:last-child { border-bottom:0; }
    .workspace-title { display:flex; align-items:center; gap:8px; justify-content:space-between; }
    .workspace-title strong { font-size:13px; overflow-wrap:anywhere; }
    .workspace-title button { width:auto; flex-shrink:0; padding:4px 8px; font-size:11px; }
    .workspace-details { color:light-dark(var(--muted),#acb8c9); font-size:11px; margin:2px 0 0; white-space:nowrap; }
    .session-row { display:flex; align-items:center; gap:8px; padding:5px 0 0; }
    .session-info { min-width:0; flex:1; }
    .session-info strong { display:block; font-size:12px; }
    .session-info span { display:block; color:light-dark(var(--muted),#acb8c9); font-size:11px; }
    .session-row button { width:auto; padding:5px 9px; font-size:11px; }
    #message { margin-top:8px; font-size:11px; overflow-wrap:anywhere; }
    #message:empty { display:none; }
    [hidden] { display:none !important; }
  </style>
  <script type="module" src="popup.mjs"></script>
</head>
<body>
  <header class="panel-heading">
    <span id="daemon-status" class="daemon-state" role="status">Connecting…</span>
  </header>
  <div id="workspace-list" class="session-list" aria-label="Workspaces" aria-live="polite">Connecting…</div>
  <section id="confirmation" hidden aria-label="Confirm clear sessions">
    <p id="confirm-text">Stop the selected WebHelm session(s)? Tasks in progress may be interrupted. Queued jobs remain and may create new sessions.</p>
    <div class="buttons">
      <button id="cancel">Cancel</button>
      <button class="danger" id="confirm">Confirm stop</button>
    </div>
  </section>
  <div id="message" role="status" aria-live="polite"></div>
</body>
</html>
